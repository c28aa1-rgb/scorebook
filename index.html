<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scorebook">
<title>Scorebook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Launch animation (about 2.5 s): the ball drops in, the scorebook cell slides up, the
     basket's slash is drawn and the name fades in. app.js removes it once the app is ready. -->
<div id="splash" aria-hidden="true">
  <svg class="sp-logo" viewBox="60 60 420 420">
    <defs>
      <radialGradient id="sp-ballfill" cx="36%" cy="30%" r="78%">
        <stop offset="0" stop-color="#4E6AF7"/><stop offset="0.55" stop-color="#2340C8"/><stop offset="1" stop-color="#14278A"/>
      </radialGradient>
    </defs>
    <g class="sp-ball">
      <g transform="translate(226 226)">
        <circle r="150" fill="url(#sp-ballfill)"/>
        <g fill="none" stroke="#0E1A5C" stroke-width="11" stroke-linecap="round">
          <path d="M0 -148 V148"/><path d="M-148 0 H148"/>
          <path d="M-104 -107 Q-42 0 -104 107"/><path d="M104 -107 Q42 0 104 107"/>
        </g>
      </g>
    </g>
    <g class="sp-cell">
      <rect x="270" y="270" width="190" height="190" rx="34" fill="#101820"/>
      <rect x="290" y="290" width="150" height="150" rx="20" fill="#FFFFFF"/>
      <text x="306" y="334" font-family="Arial Narrow, Roboto Condensed, Arial, sans-serif" font-weight="700" font-size="38" fill="#1D5C55">2</text>
      <path class="sp-slash" d="M322 408 L410 320" pathLength="1" fill="none" stroke="#2340C8" stroke-width="22" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="sp-word">SCOREBOOK</div>
</div>
<div id="app"><p class="boot">Opening scorebook…</p></div>
<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="js/report.js"></script>
<script src="js/sample.js"></script>
<script src="js/schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
