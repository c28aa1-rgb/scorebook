<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Scorebook icon: a royal-blue ball with a scorebook cell tucked against it, marked with the
       pencil slash the running score uses for a basket. Source for the PNG icons
       (tools/render-icons.html) and the launch animation (index.html). -->
  <defs>
    <radialGradient id="ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#4E6AF7"/>
      <stop offset="0.55" stop-color="#2340C8"/>
      <stop offset="1" stop-color="#14278A"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#101820"/>
  <g transform="translate(226 226)">
    <circle r="150" fill="url(#ball)"/>
    <g fill="none" stroke="#0E1A5C" stroke-width="11" stroke-linecap="round">
      <path d="M0 -148 V148"/>
      <path d="M-148 0 H148"/>
      <path d="M-104 -107 Q-42 0 -104 107"/>
      <path d="M104 -107 Q42 0 104 107"/>
    </g>
  </g>
  <!-- the scorebook cell: ink gap, white cell, running-score number, slash -->
  <rect x="270" y="270" width="190" height="190" rx="34" fill="#101820"/>
  <rect x="290" y="290" width="150" height="150" rx="20" fill="#FFFFFF"/>
  <text x="306" y="334" font-family="Arial Narrow, Roboto Condensed, Arial, sans-serif" font-weight="700" font-size="38" fill="#1D5C55">2</text>
  <path d="M322 408 L410 320" fill="none" stroke="#2340C8" stroke-width="22" stroke-linecap="round"/>
</svg>
