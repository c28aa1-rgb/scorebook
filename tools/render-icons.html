<!doctype html>
<meta charset="utf-8">
<title>Render icons</title>
<!--
  Renders the PNG icons from icons/icon.svg. Open through the dev server
  (node tools/serve.js, then http://localhost:8080/tools/render-icons.html) and save each image
  into icons/ under the name shown.
  - icon-192.png / icon-512.png: the rounded icon (manifest "any").
  - icon-maskable-512.png: full-bleed square with the art inside the 80% safe zone (Android).
  - apple-touch-icon.png: 180px square, no transparency (iOS rounds it itself).
-->
<style>body{font-family:sans-serif;background:#ddd;display:flex;flex-wrap:wrap;gap:16px;padding:16px}figure{margin:0;text-align:center}</style>
<body>
<script>
  var SIZES = [['icon-192.png', 192, 'round'], ['icon-512.png', 512, 'round'], ['icon-maskable-512.png', 512, 'mask'], ['apple-touch-icon.png', 180, 'square']];
  window.rendered = {};
  var img = new Image();
  img.onload = function () {
    SIZES.forEach(function (s) {
      var c = document.createElement('canvas'), x = c.getContext('2d'), n = s[1];
      c.width = c.height = n;
      if (s[2] !== 'round') { x.fillStyle = '#101820'; x.fillRect(0, 0, n, n); }
      var inset = s[2] === 'mask' ? n * 0.1 : 0;
      x.drawImage(img, inset, inset, n - 2 * inset, n - 2 * inset);
      var url = c.toDataURL('image/png');
      window.rendered[s[0]] = url.split(',')[1];
      var f = document.createElement('figure'), a = document.createElement('a'), i = document.createElement('img');
      i.src = url; i.width = Math.min(n, 192); a.href = url; a.download = s[0]; a.appendChild(i);
      f.appendChild(a); f.appendChild(document.createElement('figcaption')).textContent = s[0];
      document.body.appendChild(f);
    });
    window.done = true;
  };
  img.src = '../icons/icon.svg';
</script>
</body>
